<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#e3eaf3"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#222c40"/>
      <stop offset="0.7" stop-color="#141b2a"/>
      <stop offset="1" stop-color="#0c1220"/>
    </radialGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="540" y1="360" x2="820" y2="470">
      <stop offset="0" stop-color="#3ad3ff"/>
      <stop offset="1" stop-color="#8d9bb3"/>
    </linearGradient>
    <clipPath id="discclip"><circle cx="512" cy="512" r="380"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 圆角方形浅色背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 盘外柔光环 -->
  <circle cx="512" cy="512" r="398" fill="none" stroke="#ffffff" stroke-width="22" opacity="0.55"/>
  <circle cx="512" cy="512" r="392" fill="#cfd8e6" opacity="0.5"/>

  <!-- 深色雷达盘 -->
  <circle cx="512" cy="512" r="380" fill="url(#disc)"/>

  <!-- 网格（裁剪到盘内） -->
  <g clip-path="url(#discclip)" stroke="#36456180" fill="none">
    <circle cx="512" cy="512" r="95" stroke-width="3"/>
    <circle cx="512" cy="512" r="190" stroke-width="3"/>
    <circle cx="512" cy="512" r="285" stroke-width="3"/>
    <line x1="512" y1="132" x2="512" y2="892" stroke-width="3" opacity="0.8"/>
    <line x1="132" y1="512" x2="892" y2="512" stroke-width="3" opacity="0.8"/>
    <line x1="243" y1="243" x2="781" y2="781" stroke-width="2.5" opacity="0.55"/>
    <line x1="781" y1="243" x2="243" y2="781" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- 方位刻度：北=青，其余=浅灰 -->
  <g stroke-linecap="round" stroke-width="13">
    <line x1="512" y1="140" x2="512" y2="178" stroke="#3ad3ff"/>
    <line x1="512" y1="846" x2="512" y2="884" stroke="#9fb0c8"/>
    <line x1="140" y1="512" x2="178" y2="512" stroke="#9fb0c8"/>
    <line x1="846" y1="512" x2="884" y2="512" stroke="#9fb0c8"/>
  </g>

  <!-- 右上角声波弧（检测到的方位） -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M 538 364 A 150 150 0 0 1 660 486" stroke-width="36" opacity="1"/>
    <path d="M 552 286 A 230 230 0 0 1 739 472" stroke-width="32" opacity="0.8"/>
    <path d="M 566 207 A 310 310 0 0 1 817 458" stroke-width="28" opacity="0.55"/>
  </g>

  <!-- 中心枢纽 + 白点 -->
  <circle cx="512" cy="512" r="62" fill="#0b0f18"/>
  <circle cx="512" cy="512" r="62" fill="none" stroke="#2b3850" stroke-width="3"/>
  <circle cx="512" cy="512" r="16" fill="#ffffff" filter="url(#soft)" opacity="0.9"/>
  <circle cx="512" cy="512" r="11" fill="#ffffff"/>
</svg>
